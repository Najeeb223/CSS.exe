<!DOCTYPE html>
<html>
<head>
  <style>
    html {
      font-size: 10px;
    }

    body {
      font-family: monospace;
      background: #c5d7d7;
      color: black;
    }

    #first-rem {
      font-size: 10px;
    }

    #second-rem {
      font-size: 2rem;
    }

    #third-rem {
      font-size: 2rem;
    }
  </style>
</head>
<body>
  <p id="first-rem">
    This font-size is 10px;<br>
    <span id="second-rem">This font-size is 2rem (2 x 10) = 20px<br>
      <span id="third-rem">This font-size is 2rem again with the same result (2 x 10) = 10px</span>
    </span>
  </p>
</body>
</html>
